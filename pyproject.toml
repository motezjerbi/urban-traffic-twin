[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-traffic-twin"
version = "0.1.0"
description = "Digital twin of one signalised Paris intersection in SUMO, calibrated on City of Paris sensor data."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1"]
# SUMO pinned (Part 3, D17): netconvert output, TLS link order and the grid regression
# fixture depend on the version. Ruff pinned so CI formats like the local checkout.
sim = ["eclipse-sumo==1.28.0", "traci==1.28.0", "sumolib==1.28.0", "libsumo==1.28.0"]
dev = ["pytest>=8", "ruff==0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "sumo: runs the real SUMO binaries (skipped automatically when SUMO is not installed; deselect with -m 'not sumo')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "PIE"]
