[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-traffic-twin"
version = "0.1.0"
description = "Digital twin of one signalised Paris intersection in SUMO, calibrated on City of Paris sensor data."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
db = ["supabase>=2.4", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
