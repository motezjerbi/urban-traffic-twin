[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-traffic-twin"
version = "0.1.0"
description = "Digital twin of one signalised Paris intersection in SUMO, calibrated on City of Paris sensor data."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1"]
# SUMO pinned (Part 3, D17): netconvert output, TLS link order and the grid regression
# fixture depend on the version. Ruff pinned so CI formats like the local checkout.
sim = ["eclipse-sumo==1.28.0", "traci==1.28.0", "sumolib==1.28.0", "libsumo==1.28.0"]
dev = ["pytest>=8", "ruff==0.17.0"]
# Parts 5-6 (D66), pinned to the versions the results were made with. CI installs torch
# from the CPU index first (a plain install pulls the CUDA toolkit) and leaves `ml` out:
# xgboost on Linux pulls nvidia-nccl, so its tests use pytest.importorskip.
ml = ["xgboost==3.4.1"]
api = ["fastapi==0.143.2", "uvicorn==0.54.0", "pydantic==2.14.1", "httpx==0.28.1", "duckdb==1.5.6"]
rl = ["gymnasium==1.4.0", "stable-baselines3==2.9.0", "torch==2.14.1"]
# Parts 9-10 (D118), pinned to the installed versions: the Streamlit Operator and its
# Plotly charts; the report PDF and the slide deck.
app = ["streamlit==1.66.1", "plotly==7.1.0"]
report = ["python-pptx==1.0.2", "reportlab==5.1.0", "markdown==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"traffic_twin.app" = ["*.html", "*.js"] # mock screens and assets served by the API at /mock (D54)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "sumo: runs the real SUMO binaries (skipped automatically when SUMO is not installed; deselect with -m 'not sumo')",
    "browser: drives a headless Chrome or Edge (TT_BROWSER overrides; skipped when none is found; deselect with -m 'not browser')",
]
filterwarnings = [
    # Starlette's TestClient warns that it is built on httpx (D66); the API tests use it
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "PIE"]

[tool.ruff.lint.per-file-ignores]
# Streamlit dashboard: long lines are embedded CSS/HTML strings
"app.py" = ["E501"]
