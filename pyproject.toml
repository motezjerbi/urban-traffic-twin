[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-traffic-twin"
version = "0.1.0"
description = "Digital twin of one signalised Paris intersection in SUMO, calibrated on City of Paris sensor data."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1"]
sim = ["eclipse-sumo>=1.20", "traci>=1.20", "sumolib>=1.20", "libsumo>=1.20"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "sumo: runs the real SUMO binaries (skipped automatically when SUMO is not installed; deselect with -m 'not sumo')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "PIE"]
