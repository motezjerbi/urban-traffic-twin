  - {id: C, name: "Bd de l'Hopital x Bd Saint-Marcel", modelled: true}
  - {id: U1, name: "next signal upstream (not modelled)", modelled: false}
  - {id: U2, name: "hospital gate (not modelled)", modelled: false}
