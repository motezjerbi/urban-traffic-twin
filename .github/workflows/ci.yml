name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Fonts
        # Carlito is metric-compatible with Calibri, the deck font: report/slides.py
        # measures slide titles with it, so Linux checks titles exactly as Windows does.
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito

      - name: Install
        # eclipse-sumo wheels ship the sumo/netconvert binaries, so the `sumo`-marked
        # integration tests run here too. SUMO is pinned in pyproject.toml. torch comes
        # from the CPU index (a plain install pulls the CUDA toolkit). xgboost (extra
        # `ml`) is not installed in CI: it pulls nvidia-nccl on Linux, and its tests use
        # pytest.importorskip. `app` (Streamlit, Plotly) and `report` (python-pptx,
        # reportlab, markdown) serve the Parts 9-10 tests (D118).
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,sim,api,rl,app,report]"

      - name: SUMO version
        run: python -c "import sumolib; print('SUMO', sumolib.version.gitDescribe())"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Tests
        # A fresh checkout: no data/raw, data/processed or data/results, so the tests
        # read only versioned files. The grid regression fixture was captured on
        # Windows; here it compares within 5 % and warns. The headless-browser view tests
        # (`browser` marker) run locally only (`tasks.py test-browser`, D110).
        run: python -m pytest -q -m "not browser"

      - name: Demo rehearsal (fixtures)
        # The Part 10 rehearsal on the synthetic api.fixtures in a temporary folder: no
        # real data, no SUMO, no browser (D110, D116).
        run: python tasks.py demo-rehearsal --fixtures --no-browser
