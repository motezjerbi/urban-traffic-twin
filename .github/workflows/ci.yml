name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # eclipse-sumo wheels ship the sumo/netconvert binaries, so the `sumo`-marked
        # integration tests run here too. SUMO is pinned in pyproject.toml.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,sim]"

      - name: SUMO version
        run: python -c "import sumolib; print('SUMO', sumolib.version.gitDescribe())"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Tests
        # A fresh checkout: no data/raw, data/processed or data/results, so the tests
        # read only versioned files. The grid regression fixture was captured on
        # Windows; here it compares within 5 % and warns.
        run: python -m pytest -q
